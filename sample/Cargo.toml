[package]
name = "sample-vbs-enclave-rs"
version = "0.2.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[lib]
crate-type = ["cdylib"]
test = false

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[features]
strict_memory = []

[dependencies]
vbs-enclave = { path = "..", features=["zerocopy"] }
zerocopy = { version = "0.8.24", features=["derive"] }
hex-literal = "0.4.1"
spin = "0.9.8"

[dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_System_Environment",
    "Win32_Security_Cryptography",
    "Win32_Foundation"
]